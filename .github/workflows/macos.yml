name: macOS installers
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui-tahoe:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Exercise installer windows on macOS 26
        run: |
          xcrun swiftc -swift-version 5 -O installer/macos/Installer.swift installer/macos/main.swift -o /tmp/QueueCompanion.Launcher
          python3 -c 'import subprocess; subprocess.run(["/tmp/QueueCompanion.Launcher", "--ui-self-test"], check=True, timeout=45)'
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.300'
      - name: Build and test the Spotify extension
        working-directory: extension
        run: |
          npm ci
          npm test
          npm run build
      - name: Build and verify native installer
        run: python3 build-macos.py
      - uses: actions/upload-artifact@v4
        with:
          name: QueueCompanion-macOS-${{ matrix.arch }}
          path: |
            release/macos-${{ matrix.arch }}/*.dmg
            release/macos-${{ matrix.arch }}/*.sha256
            release/macos-${{ matrix.arch }}/*-build-proof.json
          if-no-files-found: error
